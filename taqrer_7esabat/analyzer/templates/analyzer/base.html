<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}تقرير حسابات{% endblock %}</title>
    <!-- Bootstrap RTL CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'analyzer/css/style.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Mobile Toggle -->
    <button class="btn btn-primary d-md-none m-3 mobile-toggle" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Sidebar -->
    <div class="sidebar offcanvas-md offcanvas-end" tabindex="-1" id="sidebar" aria-labelledby="sidebarLabel">
        <div class="sidebar-header p-4">
            <h3 class="text-white m-0 d-flex align-items-center">
                <i class="fas fa-chart-line me-2 ms-2"></i>
                تقرير حسابات
            </h3>
        </div>
        <div class="sidebar-menu mt-4">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a href="{% url 'upload' %}" class="nav-link {% if request.resolver_match.url_name == 'upload' %}active{% endif %}">
                        <i class="fas fa-cloud-upload-alt ms-2"></i> رفع ملف
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{% if analysis_id %}{% url 'dashboard' analysis_id %}{% else %}#{% endif %}" class="nav-link {% if not analysis_id %}disabled{% endif %} {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                        <i class="fas fa-tachometer-alt ms-2"></i> لوحة التحكم
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{% if analysis_id %}{% url 'insights' analysis_id %}{% else %}#{% endif %}" class="nav-link {% if not analysis_id %}disabled{% endif %} {% if request.resolver_match.url_name == 'insights' %}active{% endif %}">
                        <i class="fas fa-chart-pie ms-2"></i> التحليلات
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'history' %}" class="nav-link {% if request.resolver_match.url_name == 'history' %}active{% endif %}">
                        <i class="fas fa-history ms-2"></i> سجل الملفات
                    </a>
                </li>
            </ul>
        </div>
        <div class="sidebar-footer p-4 text-center mt-auto">
            <small class="text-white-50">&copy; تقرير حسابات 2024</small>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid p-4">
            <div class="page-header mb-4">
                <h2>{% block page_title %}{% endblock %}</h2>
            </div>
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">جاري التحميل...</span>
        </div>
        <div class="mt-2 fw-bold" id="loading-text">جاري التحميل...</div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
